version: '3.8'

services:
  backend_ts:
    build: ./backend-typescript
    container_name: backend_ts
    ports:
      - "5001:5001"
    volumes:
      - ./backend-typescript:/app
    depends_on:
      - mongo
    env_file:
      - ./backend-typescript/.env  # ✅ Load environment variables from .env
    networks:
      - mern_network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend_ts
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  # ✅ Mount updated config (No rebuild needed)
    networks:
      - mern_network

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mern_network

volumes:
  mongo_data:

networks:
  mern_network:
    driver: bridge
